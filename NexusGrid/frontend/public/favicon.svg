<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NexusGrid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120" />
      <stop offset="1" stop-color="#101a33" />
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#bg)" />
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#22314f" stroke-width="1" />

  <!-- Building/lab frame -->
  <rect x="14" y="13" width="36" height="30" rx="5" fill="none" stroke="#3b82f6" stroke-opacity="0.8" stroke-width="2" />

  <!-- Grid nodes (systems) + links -->
  <path d="M22 23h20M22 23v12M42 23v12M22 35h20" stroke="url(#grid)" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />
  <circle cx="22" cy="23" r="2.3" fill="#38bdf8" />
  <circle cx="32" cy="23" r="2.3" fill="#22c55e" />
  <circle cx="42" cy="23" r="2.3" fill="#38bdf8" />
  <circle cx="22" cy="35" r="2.3" fill="#22c55e" />
  <circle cx="32" cy="35" r="2.3" fill="#38bdf8" />
  <circle cx="42" cy="35" r="2.3" fill="#22c55e" />

  <!-- Monitoring pulse -->
  <path d="M14 49h9l3-4 3 7 4-8 3 5h14" fill="none" stroke="url(#pulse)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="49" r="2.6" fill="#22c55e" />
</svg>
